<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>John Goodman</title>
    <link rel="icon" type="image/png" href="../assets/jg.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <span class="brand">John Goodman</span>
        <a class="text-button" href="../#illustration">back to main</a>
      </div>
    </header>

    <main class="container">
      <section class="section" aria-label="ASOIAF artwork">
        <div class="project-grid">
          <article class="project-card">
            <a href="../assets/hooded-hand.png" target="_blank" rel="noreferrer">
              <img src="../assets/hooded-hand.png" alt="Hooded Hand illustration" />
            </a>
            <p>The Hooded Hand</p>
          </article>
          <article class="project-card">
            <a href="../assets/targaryen-list.png" target="_blank" rel="noreferrer">
              <img src="../assets/targaryen-list.png" alt="Targaryen list illustration" />
            </a>
            <p>Targaryen Royal Line</p>
          </article>
          <article class="project-card">
            <a href="../assets/laena.png" target="_blank" rel="noreferrer">
              <img src="../assets/laena.png" alt="Laena illustration" />
            </a>
            <p>Laena Velaryon and Vhagar</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
